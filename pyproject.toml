[project]
name = "payments-data-harness"
version = "0.1.0"
description = "Multi-agent data harness for payments, built on public Brazilian Central Bank data"
readme = "README.md"
authors = [
    { name = "VSM AI Data Engineer", email = "86484099+VitorSMarinho@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
payments-data-harness = "payments_data_harness:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
